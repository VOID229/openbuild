<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OpenBuild" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>OpenBuild</title>
    <link rel="icon" href="./icons/favicon.ico" sizes="32x32" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <script>
      // The title of the world a reload lands in, before the app has loaded.
      if (/^\/bots\/?$/.test(location.pathname)) document.title = "OpenBots · OpenBuild";
      else if (/^\/(bots\/)?usage\/?$/.test(location.pathname)) document.title = "Usage · OpenBuild";
    </script>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        var theme = "system";
        document.documentElement.dataset.font = "normal";
        try {
          var saved = JSON.parse(localStorage.getItem("openchat") || "{}").state.settings;
          theme = saved.theme || "system";
          document.documentElement.dataset.font = saved.font || "normal";
        } catch (e) {}
        var dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#000000" : "#ffffff";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
