name: Checks

# Pull requests are how changes land (AGENTS.md), so they're where the checks run. Pushes to main
# only publish (nightly.yml): the commit was checked in its pull request.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request supersedes its own earlier run.
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  # The suite in quarters, side by side: scripts/test.ts deals the files out by how long they take.
  # To change how many, change the list; the total follows it.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: EXPERIMENT browsers
        if: matrix.shard == 1
        run: |
          for b in chromium chromium-browser google-chrome google-chrome-stable; do which $b && readlink -f "$(which $b)" || true; done
          echo "$CHROME_BIN"
          for b in google-chrome chromium chromium-browser; do
            if which $b >/dev/null; then
              for i in 1 2; do
                s=$(date +%s.%N); $b --headless --disable-gpu --no-sandbox --user-data-dir=/tmp/exp-$b-$i --dump-dom about:blank >/dev/null 2>&1 || true; e=$(date +%s.%N)
                echo "$b run $i: $(echo "$e - $s" | bc) s"
              done
            fi
          done
      # Two files at a time (one with a browser) on the 4-vCPU runner: at 4 a run on two cores
      # with hyperthreads failed 7 timing-sensitive files (5 s timeouts, animation frames).
      - run: bun run test --shard ${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          TEST_JOBS: 2

  # The one check main's branch protection requires: green only when everything above is.
  checks:
    if: always()
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          [[ "${{ needs.typecheck.result }}" == success && "${{ needs.test.result }}" == success ]]
