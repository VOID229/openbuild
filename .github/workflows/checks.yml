name: Checks

# Pull requests are how changes land (AGENTS.md), so they're where the checks run. Pushes to main
# only publish (nightly.yml): the commit was checked in its pull request.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request supersedes its own earlier run.
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
