name: Checks

# Pull requests are how changes land (AGENTS.md), so they're where the checks run. Pushes to main
# only publish (nightly.yml): the commit was checked in its pull request.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request supersedes its own earlier run.
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  # The suite in fifths, side by side: scripts/test.ts deals the files out by how long they take.
  # To change how many, change the list; the total follows it.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # A runner's first Chrome takes about 8 s to start, and 20 or more beside running tests: start
      # one now, in the background, so that it's up by the time the install is done.
      - name: Start warming Chrome
        run: |
          (nohup sh -c 'chromium --headless --disable-gpu --no-sandbox --user-data-dir="$RUNNER_TEMP/warm-chrome" --dump-dom about:blank; touch "$RUNNER_TEMP/chrome-warm"' > /dev/null 2>&1 &)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Wait for Chrome
        run: timeout 60 sh -c 'until [ -e "$RUNNER_TEMP/chrome-warm" ]; do sleep 0.2; done' || true
      # Two files at a time (one with a browser) on the 4-vCPU runner: at 4 a run on two cores
      # with hyperthreads failed 7 timing-sensitive files (5 s timeouts, animation frames).
      - run: bun run test --shard ${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          TEST_JOBS: 2

  # The one check main's branch protection requires: green only when everything above is.
  checks:
    if: always()
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          [[ "${{ needs.typecheck.result }}" == success && "${{ needs.test.result }}" == success ]]
