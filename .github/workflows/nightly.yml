name: Nightly release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishes main's newest commit as the next version, x.y.z-nightly, a prerelease. It was checked in
# its pull request (checks.yml), so nothing is re-run here. promote.yml declares one stable.
permissions:
  contents: read

concurrency:
  group: nightly-main
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Publish the commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # A manual rerun of an old workflow must never become the newest nightly.
          latest=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "Skipping superseded commit $GITHUB_SHA."
            exit 0
          fi

          # The next version after the newest tagged: 0.1.9-nightly after 0.1.8, 0.2.0-nightly after
          # 0.1.99-nightly (shared/version.ts). A rerun keeps the commit's tag.
          tag=$(bun scripts/next-version.ts "$GITHUB_SHA")

          # Re-running a successful workflow preserves its existing release and tag.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --prerelease --latest=false --generate-notes
