name: Nightly release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishes main's newest commit as a nightly. It was checked in its pull request (checks.yml),
# so nothing is re-run here.
permissions:
  contents: read

concurrency:
  group: nightly-main
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish the commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # A manual rerun of an old workflow must never become the newest nightly.
          latest=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "Skipping superseded commit $GITHUB_SHA."
            exit 0
          fi

          base=$(git tag --merged "$GITHUB_SHA" --sort=-version:refname \
            | awk '/^v?[0-9]+\.[0-9]+\.[0-9]+$/ && !found { print; found=1 }')
          if [[ -z "$base" ]]; then
            echo "No stable version tag found in this commit's history." >&2
            exit 1
          fi
          date=$(git show -s --format=%cs "$GITHUB_SHA" | tr -d '-')
          tag="${base}-nightly.${date}.${GITHUB_RUN_NUMBER}"

          # Re-running a successful workflow preserves its existing release and tag.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --prerelease --latest=false --generate-notes
